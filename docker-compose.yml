services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: dockslot
      POSTGRES_PASSWORD: dockslot
      POSTGRES_DB: dockslot
    ports:
      # 5433 on the host so a locally installed PostgreSQL on 5432 does not clash.
      - "5433:5432"
    volumes:
      - dockslot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockslot -d dockslot"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dockslot-pgdata:
